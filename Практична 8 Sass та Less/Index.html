<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Картки курсів</title>
  <link rel="stylesheet" href="style-scss.css">
</head>
<body>
  <div class="courses">
    <div class="card">
      <h3>Основи HTML & CSS</h3>
      <p>Базовий курс верстки вебсторінок з нуля.</p>
      <span class="duration">Тривалість: 20 годин</span>
      <button class="btn">Детальніше</button>
    </div>
    <div class="card">
      <h3>Препроцесори Sass/Less</h3>
      <p>Оптимізація та прискорення написання стилів.</p>
      <span class="duration">Тривалість: 15 годин</span>
      <button class="btn">Детальніше</button>
    </div>
    <div class="card">
      <h3>Основи JavaScript</h3>
      <p>Створення динамічних та інтерактивних інтерфейсів.</p>
      <span class="duration">Тривалість: 30 годин</span>
      <button class="btn">Детальніше</button>
    </div>
  </div>
</body>
</html>
