<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Таблиця</title>
</head>
<body>

    <table border="1">
        <caption>Результати навчання студентів</caption>
        <thead>
            <tr>
                <th rowspan="2">Прізвище та ім'я</th>
                <th colspan="2">Практичні роботи</th>
                <th rowspan="2">Тест</th>
                <th rowspan="2">Підсумкова оцінка</th>
            </tr>
            <tr>
                <th>Практична робота №1</th>
                <th>Практична робота №2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Іваненко Іван</td>
                <td colspan="2">10</td>
                <td>11</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Петренко Петро</td>
                <td>12</td>
                <td>11</td>
                <td>12</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Сидоренко Олена</td>
                <td>9</td>
                <td>8</td>
                <td>9</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Коваль Андрій</td>
                <td>11</td>
                <td>10</td>
                <td>11</td>
                <td>11</td>
            </tr>
            <tr>
                <td>Мельник Марія</td>
                <td>10</td>
                <td>12</td>
                <td>11</td>
                <td>11</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="5">Кількість студентів: 5</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
